# NFS hosting service in kubernetes
# This is a simple NFS server deployment for Kubernetes.

## Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: knitfab-dev-cluster-infra
  labels:
    name: knitfab-dev-cluster-infra

---
## Deployment
# This pod should be start on controlplane node, named "knitfab-dev-cluster"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: knitfab-dev-cluster-infra
  labels:
    app: nfs-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      namespace: knitfab-dev-cluster-infra
      labels:
        app: nfs-server
    spec:
      containers:
        - name: nfs-server
          image: itsthenetwork/nfs-server-alpine:latest
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN", "SETPCAP"]
          ports:
            - containerPort: 2049
              protocol: TCP
            - containerPort: 111
              protocol: TCP
            - containerPort: 111
              protocol: UDP
          volumeMounts:
            - name: nfs-data
              mountPath: /nfsshare
          env:
            - name: SHARED_DIRECTORY
              value: /nfsshare
            - name: NFS_VERSION
              value: "4"
            - name: RPCMOUNTD_PORT
              value: "111"
            - name: RPCNFSDCOUNT
              value: "8"
            - name: RPCNFSDPRIORITY
              value: "0"
            - name: MOUNTD_PORT
              value: "111"
            - name: NFS_PORT
              value: "2049"
            - name: LOCKD_TCPPORT
              value: "32803"
            - name: LOCKD_UDPPORT
              value: "32803"
      volumes:
        - name: nfs-data
          hostPath:
            path: /exports
            type: DirectoryOrCreate
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: minikube.k8s.io/name
                    operator: In
                    values:
                      - knitfab-dev-cluster

---
## Service
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: knitfab-dev-cluster-infra
  labels:
    app: nfs-server
spec:
  type: ClusterIP
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
    - name: rpcbind
      port: 111
      targetPort: 111
  selector:
    app: nfs-server
