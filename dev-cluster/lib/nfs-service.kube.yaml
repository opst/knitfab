# NFS hosting service in kubernetes
# This is a simple NFS server deployment for Kubernetes.

## Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: knitfab-dev-cluster-infra
  labels:
    name: knitfab-dev-cluster-infra

---
## Deployment
# This pod should be start on controlplane node, named "knitfab-dev-cluster"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: knitfab-dev-cluster-infra
  labels:
    app: nfs-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      namespace: knitfab-dev-cluster-infra
      labels:
        app: nfs-server
    spec:
      initContainers:
        - name: init-recovery-dir
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["mkdir -p /var/lib/nfs/ganesha/v4_recovery/node0"]
          volumeMounts:
            - name: nfs-recovery
              mountPath: /var/lib/nfs/ganesha/v4_recovery
        # - name: init-shared-dir
        #   image: busybox
        #   command: ["/bin/sh", "-c"]
        #   args: ["touch /export/ganesha"]
        #   volumeMounts:
        #     - name: nfs-data-ganesha
        #       mountPath: /export
      containers:
        - name: nfs-server
          image: hectorm/nfs-ganesha:v9
          # command:
          #   - sleep
          # args:
          #   - "30000000"
          securityContext:
            capabilities:
              add: 
                - "SYS_RESOURCE"
                - "CHOWN"
                - "DAC_OVERRIDE"
                - "DAC_READ_SEARCH"
                - "FOWNER"
                - "FSETID"
                - "SETGID"
                - "SETUID"
          ports:
            - containerPort: 2049
              protocol: TCP
            - containerPort: 111
              protocol: TCP
            - containerPort: 111
              protocol: UDP
          volumeMounts:
            - name: nfs-data-ganesha
              mountPath: /var/lib/nfs/ganesha/export
            - name: nfs-data
              mountPath: /export
            - name: nfs-recovery
              mountPath: /var/lib/nfs/ganesha/v4_recovery
            - name: config
              mountPath: /etc/ganesha/
            - name: mtab
              mountPath: /etc/mtab
      volumes:
        - name: nfs-data-ganesha
          emptyDir: {}
        - name: nfs-data
          hostPath:
            path: /data/export
            type: DirectoryOrCreate
        - name: nfs-recovery
          emptyDir: {}
        - name: config
          configMap:
            name: nfs-server-config
        - name: mtab
          hostPath:
            path: /proc/self/mounts
            type: File
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: minikube.k8s.io/name
                    operator: In
                    values:
                      - knitfab-dev-cluster

---
# configmap overridding entrypoint
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-server-config
  namespace: knitfab-dev-cluster-infra
  labels:
    app: nfs-server
data:
  ganesha.conf: |
    NFS_Core_Param {
      NFS_Port = 2049;
      Protocols = 4;
      Fsid_Device = true;
      mount_path_pseudo = true;
    }

    NFSv4 {
      RecoveryBackend = fs_ng;
      RecoveryDir = v4_recovery;
      Lease_Lifetime = 40;
      Grace_Period = 50;
      Only_Numeric_Owners = true;
    }

    VFS {}

    EXPORT {
      Export_id = 1;
      Path = /export;
      Pseudo = /;

      Access_Type = RW;
      Squash = noidsquash;
      SecType = sys;
      Protocols = 4;

      FSAL {
        Name = "vfs";
      }
    }

    LOG {
      Default_Log_Level = INFO;
    }

---
## Service
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: knitfab-dev-cluster-infra
  labels:
    app: nfs-server
spec:
  type: ClusterIP
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
    - name: rpcbind
      port: 111
      targetPort: 111
  selector:
    app: nfs-server
